[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chat-bridge"
version = "0.1.0"
description = "A RAG demo that turns market news into a searchable knowledge base, so users can ask questions in natural language and adjust their investment settings against metrics they define themselves."
readme = "README.md"
requires-python = ">=3.11.5"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.163.2",
    "jieba>=0.42.1",
    "langchain-text-splitters==1.1.3",
    "markdown-it-py>=4.3.0",
    "markitdown[docx]>=0.1.9",
    "mdit-py-plugins>=0.7.0",
    "office-oxide==0.1.17",
    "pgvector>=0.5.1",
    "pixeltable-pgserver==0.7.2",
    "psutil>=7.2.2",
    "pydantic>=2.14.3",
    "pypdf==6.21.4",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.3.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "torch>=2.15.0",
]

[project.scripts]
chat-bridge = "chat_bridge.cli:main"

[dependency-groups]
dev = [
    "ast-grep-cli>=0.51.3",
    "mypy>=2.4.1",
    "pytest",
    "ruff>=0.17.5",
]

[tool.hatch.build.targets.wheel]
packages = ["chat_bridge"]

# CPU-only PyTorch on every platform, as uv's PyTorch guide shows. Without this, Linux gets
# the CUDA build from PyPI, which adds several gigabytes the embedding model does not need.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

# The strict options follow the FastAPI repository. The slow marker is registered and left
# out by default, as pytest's documentation shows; `pytest -m slow` runs only those tests.
[tool.pytest]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "-m", "not slow"]
markers = [
    "slow: needs the embedding model and the embedded database and takes minutes (run with '-m slow')",
]

# Type checking and lint rules follow the FastAPI repository's pyproject.toml.
[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
module = ["jieba", "jieba.*", "psutil", "yaml"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by the formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
